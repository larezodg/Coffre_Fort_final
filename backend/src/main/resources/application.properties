# Port et Context Path
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# Base de données MySQL
# NB: 'db' correspond au nom du service MySQL défini dans docker-compose.yml
# Base de données MySQL (Railway injecte MYSQL_URL ou MYSQLURL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# "update" ou "validate" selon votre gestion de schéma. En prod, show-sql est désactivé par défaut pour la performance et la sécurité.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Configuration JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Upload fichiers
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Chemin dans le conteneur Docker (sera lié à un volume Docker)
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads}

# Logging (Niveau INFO en prod par défaut)
logging.level.cm.coffrefort=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:WARN}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Swagger UI / OpenAPI (Désactivable en prod via variable d'environnement si besoin)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
