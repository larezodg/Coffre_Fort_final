<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dégradé bleu médical fidèle à l'image -->
    <linearGradient id="medicalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>

    <!-- Ombre douce pour le cœur -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Fond circulaire -->
  <circle cx="250" cy="250" r="240" fill="url(#medicalGradient)" />

  <!-- Lignes décoratives en arc (reprise du fond de l'image) -->
  <circle cx="250" cy="420" r="260" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
  <circle cx="250" cy="420" r="320" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Icône Cœur Médical -->
  <g transform="translate(250, 150) scale(1.3)" filter="url(#softShadow)">
    <path 
      d="M 0 12 C -8 -10, -36 -10, -36 14 C -36 34, -14 52, 0 66 C 14 52, 36 34, 36 14 C 36 -10, 8 -10, 0 12 Z" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="5.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>

  <!-- Titre : Coffre-fort Numérique -->
  <text 
    x="250" 
    y="280" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="700" 
    font-size="28" 
    letter-spacing="0.3"
  >
    Coffre-fort Numérique
  </text>

  <!-- Sous-titre : Dossier Patient Souverain -->
  <text 
    x="250" 
    y="320" 
    text-anchor="middle" 
    fill="#BBDEFB" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="400" 
    font-size="19" 
    letter-spacing="0.2"
  >
    Dossier Patient Souverain
  </text>
</svg>
